name: tokens

on:
  pull_request:
    paths: ['packages/tokens/**']
  push:
    branches: [main]
    paths: ['packages/tokens/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run tokens:verify
      - run: npm run tokens:build
